services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      # ChromaDB 데이터 (로컬 RAG/db → 컨테이너 /app/RAG/db)
      - ./RAG/db:/app/RAG/db
      # HuggingFace / torch 모델 캐시 재사용
      - model-cache:/root/.cache
    env_file:
      - .env
    environment:
      - DB_PATH=/app/RAG/db
      # Whisper 모델 (기본: SungBeom/whisper-small-ko — 한국어 fine-tuned)
      # - 다른 모델 사용 시 아래 주석 해제 후 모델 ID 또는 로컬 경로 입력
      # - WHISPER_MODEL_PATH=openai/whisper-small
      # - WHISPER_MODEL_PATH=/app/models/whisper-ko-elderly
      # Ollama 파인튜닝 모델명 (intent_finetune / answer_finetune 노트북에서 GGUF 등록한 이름)
      - INTENT_MODEL=hellodoctor-intent
      - ANSWER_MODEL=hellodoctor-answer
      - OLLAMA_URL=http://host.docker.internal:11434
    # Linux 호스트에서 host.docker.internal 인식 안 되면 아래 한 줄 추가:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # GPU 사용 시 아래 주석 해제
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # 프론트가 호출할 백엔드 URL (외부 접근 가능한 주소로 변경)
        VITE_CHAT_API_URL: http://localhost:8000/chat
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  model-cache:
